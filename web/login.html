<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<title>Sign in · DLsite RSS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e60026'/%3E%3Cpath d='M9 22a2 2 0 1 0 0 .01M9 15a8 8 0 0 1 8 8M9 9a14 14 0 0 1 14 14' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="loginwrap">
  <form class="logincard" id="f" autocomplete="on">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="6" cy="18" r="2.4" fill="#fff"/><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></span>
      <span class="brand-text">DLsite <b>RSS</b></span><span class="r18">R18</span></div>
    <p class="sub">Sign in to the control panel</p>
    <div class="loginerr" id="err" hidden></div>
    <label>Username<input type="text" name="username" autocomplete="username" autofocus required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <div class="row"><input type="checkbox" id="remember" checked><label for="remember" style="margin:0;font-weight:400">Keep me signed in for 30 days</label></div>
    <button class="btn primary" id="go" type="submit">Sign in</button>
  </form>
</div>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
const next = new URLSearchParams(location.search).get('next') || '/';
f.addEventListener('submit', async e => {
  e.preventDefault(); err.hidden = true; go.disabled = true;
  try {
    const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: f.username.value, password: f.password.value, remember: document.getElementById('remember').checked, next }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = d.next || '/'; return; }
    err.textContent = d.error || 'Sign-in failed.'; err.hidden = false; f.password.select();
  } catch (x) { err.textContent = 'Could not reach the server.'; err.hidden = false; }
  go.disabled = false;
});
</script>
</body>
</html>
